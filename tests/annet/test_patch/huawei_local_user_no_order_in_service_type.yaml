# On huawei the argument order in this place changes depending on the software version
# the command is accepted in any form though, only its rendering in the config changes

- vendor: huawei
  diff: |
    aaa
      - local-user user4 service-type telnet terminal ssh ftp
      + local-user user4 service-type ftp terminal telnet ssh

  patch: |

- vendor: huawei
  diff: |
    aaa
      - local-user user5 service-type telnet terminal ssh ftp
      + local-user user5 service-type telnet terminal ssh ftp http

  patch: |
    system-view
    aaa
      local-user user5 service-type telnet terminal ssh ftp http
      quit
    q
    save

- vendor: huawei
  diff: |
    aaa
      - local-user user4 service-type telnet terminal ssh ftp
      + local-user user4 service-type ftp terminal telnet ssh
      - local-user user5 service-type telnet terminal ssh ftp
      + local-user user5 service-type telnet terminal ssh ftp http

  patch: |
    system-view
    aaa
      local-user user5 service-type telnet terminal ssh ftp http
      quit
    q
    save
