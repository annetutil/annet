# The vlan batch commands and the vlan block in a huawei config
#
# vlan batch 123 456 789
# vlan 123
#   ...
#
# have a special relationship with each other
#
# * Removing with undo vlan <vlan_id> also removes it from the vlan batch list
# * Removing with undo vlan batch <vlan_id> also removes the global vlan <vlan_id> block
# * Adding a global vlan <vlan_id> block also adds it to the vlan batch list
# * Adding <vlan_id> to the vlan batch list does NOT add a vlan <vlan_id> block
#
# This gives rise to config invariants that are hard to maintain in the generators
# and that we handle in a custom %diff_logic for these commands


# case 1: the global vlan 999 block is removed but it stays in the batch
# an empty vlan block cannot be removed while keeping it in the batch only
# both undo vlan ... and undo vlan batch ... would immediately try to wipe the vlan completely
# and wiping a vlan off the device requires the svi and other objects to be removed as well,
# which we absolutely do not want to remove - the vlan still stays on the device
# so we simply leave the global vlan block hanging around
- vendor: Huawei
  before: |
    vlan batch 333 688 700 788 999
    vlan 999

  after: |
    vlan batch 333 688 700 788 999

  patch: ""

# case 2: the reverse of case 1, an empty vlan 999 block is added
# if the global block declaring the vlan is empty
# we do not add it so as not to clutter the config
# and at the same time to keep these invariants symmetric
- vendor: Huawei
  before: |
    vlan batch 333 688 700 788 999

  after: |
    vlan batch 333 688 700 788 999
    vlan 999

  patch: ""

# case 3: vlan 999 is removed completely, both from the block and from the batch
# if the vlan is removed from both blocks then it can be wiped
# either one of the two commands would be enough here
# but both are kept so that no separate logic has to be written
- vendor: Huawei
  before: |
    vlan batch 333 688 700 788 999
    vlan 999
      name xxx

  after: |
    vlan batch 333 688 700 788

  patch: |
    system-view
    undo vlan 999
    undo vlan batch 999
    q
    save

# case 4: the reverse of case 3, vlan 999 is added
# again, adding the global declaration always adds the vlan to the vlan batch as well
# both commands are kept simply to avoid extra custom logic
- vendor: Huawei
  before: |
    vlan batch 333 688 700 788

  after: |
    vlan batch 333 688 700 788 999
    vlan 999
      name xxx

  patch: |
    system-view
    vlan batch 999
    vlan 999
      name xxx
      quit
    q
    save

# case 5: the vlan 999 block is removed but it has options in it, and it stays in the batch (a harder case 1)
# here we only remove the options themselves, and leave the global block in the config
- vendor: Huawei
  before: |
    vlan batch 333 688 700 788 999
    vlan 999
      name xxx

  after: |
    vlan batch 333 688 700 788 999

  patch: |
    system-view
    vlan 999
      undo name
      quit
    q
    save

# case 6: the reverse of case 5 - it is already in the batch but options are added to the vlan
# just for the sake of completeness
- vendor: Huawei
  before: |
    vlan batch 333 688 700 788 999

  after: |
    vlan batch 333 688 700 788 999
    vlan 999
      name xxx

  patch: |
    system-view
    vlan 999
      name xxx
      quit
    q
    save


# case 7: a combination of the previous cases, a separate vlan for each of 1001-1006
# check that the logic works as a whole
# 1001 stays hanging around (even though it is not in after)
# 1002 will not be added (even though it is in after)
# 1005 stays hanging around without a name (even though it is not visible in after)
# 2000 is declared only in the batch and does not change
# 3000 is declared both in the batch and in a block and does not change either
- vendor: Huawei
  before: |
    vlan batch 1001 to 1003 1005 to 1006 2000 3000
    vlan 1001
    vlan 1003
      name v1003
    vlan 1005
      name v1005
    vlan 3000
      name v3000

  after: |
    vlan batch 1001 to 1002 1004 to 1006 2000 3000
    vlan 1002
    vlan 1004
      name v1004
    vlan 1006
      name v1006
    vlan 3000
      name v3000

  patch: |
    system-view
    vlan batch 1004
    vlan 1004
      name v1004
      quit
    vlan 1006
      name v1006
      quit
    vlan 1005
      undo name
      quit
    undo vlan 1003
    undo vlan batch 1003
    q
    save
