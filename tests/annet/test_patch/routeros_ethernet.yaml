- name: equivalent selectors
  vendor: routeros
  before: |
    /interface ethernet
    set ether1 comment="uplink" disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="uplink" disabled=no
  patch: ""

- name: comment change
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="old uplink" disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="new uplink" disabled=no
  patch: |
    /interface ethernet set [ find default-name=ether1 ] comment="new uplink" disabled=no

- name: non-comment drift
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="uplink" disabled=yes l2mtu=1598
  after: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="uplink" disabled=no l2mtu=9500
  patch: |
    /interface ethernet set [ find default-name=ether1 ] comment=uplink disabled=no l2mtu=9500

- name: device-only attributes are not owned
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] arp=proxy-arp comment="uplink" disabled=no l2mtu=1598
  after: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="uplink" disabled=no
  patch: ""

- name: renamed interface is addressed by factory identity
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] name=uplink comment="old uplink" disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether1 ] name=uplink comment="new uplink" disabled=no
  patch: |
    /interface ethernet set [ find default-name=ether1 ] name=uplink comment="new uplink" disabled=no

- name: quote RouterOS metacharacters
  vendor: routeros
  before: |
    /interface ethernet
    set ether1 comment="old" disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="one;two[three]$four" disabled=no
  patch: |
    /interface ethernet set [ find default-name=ether1 ] comment="one;two[three]\$four" disabled=no

- name: escaped metacharacters converge after RouterOS export
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="one;two[three]\$four" disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="one;two[three]$four" disabled=no
  patch: ""

- name: clearing a comment emits one set and then converges
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="stale" disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="" disabled=no
  patch: |
    /interface ethernet set [ find default-name=ether1 ] comment="" disabled=no

- name: cleared comment is absent from export and stays converged
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="" disabled=no
  patch: ""

- name: real CHR export with wrapped rows and cleared comments
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] disable-running-check=no
    set [ find default-name=ether2 ] disable-running-check=no
    set [ find default-name=ether4 ] comment="keep me" disable-running-check=no \
        disabled=yes mtu=1400
    set [ find default-name=ether6 ] comment="to be cleared" \
        disable-running-check=no
  after: |
    /interface ethernet
    set [ find default-name=ether2 ] comment=""
    set [ find default-name=ether4 ] comment="keep me" disabled=yes mtu=1400
    set [ find default-name=ether6 ] comment=""
  patch: |
    /interface ethernet set [ find default-name=ether6 ] comment=""

- name: default disabled is omitted from real CHR export
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether2 ] comment="\D0\BF\D1\80\D0\B8 #wan \$x what\?" \
        disable-running-check=no
    set [ find default-name=ether3 ] comment="lab port" disable-running-check=no \
        disabled=yes
  after: |
    /interface ethernet
    set [ find default-name=ether2 ] comment="при #wan $x what?" disabled=no
    set [ find default-name=ether3 ] comment="lab port" disabled=yes
  patch: ""

- name: reset values omitted from real CHR export
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether2 ] disable-running-check=no
    set [ find default-name=ether3 ] comment="lab port" disable-running-check=no
    set [ find default-name=ether4 ] disable-running-check=no
  after: |
    /interface ethernet
    set [ find default-name=ether2 ] comment=""
    set [ find default-name=ether3 ] comment="lab port" disabled=no
    set [ find default-name=ether4 ] mtu=1500
  patch: ""

- name: non-ascii comment converges after RouterOS export
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="\D0\BF\D1\80\D0\B8" disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="при" disabled=no
  patch: ""

- name: new desired identity
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether2 ] comment="management" disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether2 ] comment="management" disabled=no
    set [ find default-name=ether1 ] comment="uplink" disabled=no
  patch: |
    /interface ethernet set [ find default-name=ether1 ] comment=uplink disabled=no

- name: old-only identity is unmanaged
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="unmanaged"
    set [ find default-name=ether2 ] comment="management" disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether2 ] comment="management" disabled=no
  patch: ""

- name: multiple identities are paired independently
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] comment="uplink" disabled=no
    set [ find default-name=ether2 ] comment="old management" disabled=no
  after: |
    /interface ethernet
    set [ find default-name=ether2 ] comment="new management" disabled=no
    set [ find default-name=ether1 ] comment="uplink" disabled=no
  patch: |
    /interface ethernet set [ find default-name=ether2 ] comment="new management" disabled=no

- name: compact generator selector converges with spaced export
  vendor: routeros
  before: |
    /interface ethernet
    set [ find default-name=ether1 ] disable-running-check=no
    set [ find default-name=ether2 ] disable-running-check=no comment="management"
  after: |
    /interface ethernet
    set [find default-name=ether1] comment="uplink"
    set [find default-name=ether2] comment="management"
  patch: |
    /interface ethernet set [ find default-name=ether1 ] comment=uplink
