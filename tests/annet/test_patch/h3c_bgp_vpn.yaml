- vendor: h3c
  name: replace descriptions independently in two BGP instances with the same ASN and peer
  before: |
    bgp 4201110006 instance wan
      ip vpn-instance wan
        peer FD00:1:1:600::2 description OLD_WAN
    bgp 4201110006 instance other
      ip vpn-instance other
        peer FD00:1:1:600::2 description OLD_OTHER
  after: |
    bgp 4201110006 instance wan
      ip vpn-instance wan
        peer FD00:1:1:600::2 description NEW_WAN
    bgp 4201110006 instance other
      ip vpn-instance other
        peer FD00:1:1:600::2 description NEW_OTHER
  patch: |
    system-view
    bgp 4201110006 instance wan
      ip vpn-instance wan
        peer FD00:1:1:600::2 description NEW_WAN
        quit
      quit
    bgp 4201110006 instance other
      ip vpn-instance other
        peer FD00:1:1:600::2 description NEW_OTHER
        quit
      quit
    save force
- vendor: h3c
  name: replace global peer ASN while preserving the same peer in a VPN
  before: |
    bgp 64496 instance wan
      peer 192.0.2.3 as-number 64497
      ip vpn-instance wan
        peer 192.0.2.3 as-number 64510
        peer 192.0.2.3 description VPN
  after: |
    bgp 64496 instance wan
      peer 192.0.2.3 as-number 64498
      ip vpn-instance wan
        peer 192.0.2.3 as-number 64510
        peer 192.0.2.3 description VPN
  patch: |
    system-view
    bgp 64496 instance wan
      undo peer 192.0.2.3
      peer 192.0.2.3 as-number 64498
      quit
    save force
