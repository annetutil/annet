- vendor: h3c
  name: replace 192.0.2.3 description in VPN
  before: |
    bgp 4201110006 instance wan
      ip vpn-instance wan
        peer 192.0.2.3 as-number 64497
        peer 192.0.2.3 description OLD
  after: |
    bgp 4201110006 instance wan
      ip vpn-instance wan
        peer 192.0.2.3 as-number 64497
        peer 192.0.2.3 description NEW
  patch: |
    system-view
    bgp 4201110006 instance wan
      ip vpn-instance wan
        peer 192.0.2.3 description NEW
        quit
      quit
    save force
