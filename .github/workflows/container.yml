name: Annet container

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sources:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve latest published Gnetcli release once for both architectures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python docker/resolve_gnetcli.py "$RUNNER_TEMP/sources.json"
      - uses: actions/upload-artifact@v4
        with:
          name: selected-sources
          path: ${{ runner.temp }}/sources.json
          if-no-files-found: error

  build:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: selected-sources
          path: ${{ runner.temp }}/selected-sources
      - name: Install smoke-test dependencies
        run: python -m pip install --require-hashes -r docker/tests/requirements.lock
      - name: Prepare allowlisted context with the selected Gnetcli revision
        run: python docker/prepare.py "$RUNNER_TEMP/context" --sources "$RUNNER_TEMP/selected-sources/sources.json"
      - name: Build runtime and test device
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import json; print(json.load(open("docker/sources.json"))["annet_dev_version"])')
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            version=${RELEASE_TAG#v}
          fi
          docker build --build-arg "ANNET_VERSION=$version" -t annet:test-${{ matrix.arch }} "$RUNNER_TEMP/context"
          docker build -t annet-device:test docker/tests
      - name: Record installed versions
        env:
          ANNET_TEST_IMAGE: annet:test-${{ matrix.arch }}
        run: |
          docker run --rm --entrypoint python "$ANNET_TEST_IMAGE" -c 'import json,importlib.metadata as m; from pathlib import Path; print(json.dumps({"sources":json.loads(Path("/usr/local/share/annet/versions.json").read_text()),"packages":{d.metadata["Name"]:d.version for d in m.distributions()}},indent=2))' > "$RUNNER_TEMP/versions.json"
      - name: Exercise quick start and container lifecycle
        env:
          ANNET_TEST_IMAGE: annet:test-${{ matrix.arch }}
          ANNET_TEST_DEVICE_IMAGE: annet-device:test
        run: python -m pytest -o addopts='' docker/tests --junitxml="$RUNNER_TEMP/smoke.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/smoke.xml
            ${{ runner.temp }}/versions.json
      - name: Save the tested image for publishing
        if: github.event_name != 'pull_request'
        run: docker save annet:test-${{ matrix.arch }} -o "$RUNNER_TEMP/image-${{ matrix.arch }}.tar"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          retention-days: 3
          if-no-files-found: error

  publish:
    if: >-
      github.repository == 'annetutil/annet' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && !github.event.release.prerelease))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images without rebuilding
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image=ghcr.io/annetutil/annet
          build="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tag=latest
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            tag=$RELEASE_TAG
          fi
          for arch in amd64 arm64; do
            docker load -i "image-$arch.tar"
            docker tag "annet:test-$arch" "$image:$build-$arch"
            docker push "$image:$build-$arch"
          done
          docker buildx imagetools create -t "$image:$build" -t "$image:$tag" "$image:$build-amd64" "$image:$build-arm64"
          docker buildx imagetools inspect "$image:$build"
