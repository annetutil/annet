name: Docs
on:
  push:
    tags:
      - "v*"

concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  github_pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build docs
        run: |
          pip install -r requirements-doc.txt
          latest_tag=$(git tag --list --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '1p')
          test -n "$latest_tag"
          sphinx-multiversion docs docs-build \
            -D "smv_tag_whitelist=^${latest_tag//./\\.}$" \
            -D 'smv_branch_whitelist=^$' \
            -D smv_outputdir_format=main
          cp docs/_templates/gh-pages-redirect.html docs-build/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs-build'
      - uses: actions/deploy-pages@v4
