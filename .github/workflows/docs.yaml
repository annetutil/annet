name: Docs
on:
  push:
    branches:
      - "main"
    tags:
      - "**"

concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  github_pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build docs
        run: |
          pip install -r requirements-doc.txt
          release_tags=$(git tag --list --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | awk -F. '!seen[$1]++')
          test -n "$release_tags"
          latest_tag=$(printf '%s\n' "$release_tags" | sed -n '1p')
          tag_pattern=$(printf '%s\n' "$release_tags" | sed 's/\./\\./g' | paste -sd '|' -)
          sphinx-multiversion docs docs-build \
            -D "smv_tag_whitelist=^($tag_pattern)$" \
            -D 'smv_branch_whitelist=^main$' \
            -D "smv_latest_version=$latest_tag"
          cp docs/_templates/gh-pages-redirect.html docs-build/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs-build'
      - uses: actions/deploy-pages@v4
